# Stellt die App (Ordner app/) auf GitHub Pages online.
# Läuft nach jeder Änderung an der App und nach jedem Sammel-Lauf.
name: App veröffentlichen

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: ["Termine sammeln"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      # GitHub findet das gerade hochgeladene Paket manchmal erst mit
      # Verzögerung ("No artifacts named github-pages"). Darum kurz warten
      # und bei einem Fehlschlag nach einer Minute noch einmal versuchen.
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
